<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Slice Sniper (HYBRID TURBO v6) ⚡</title>
    <style>
        :root {
            --bg: #07090f; --surface: #0d1117; --panel: #111827;
            --border: #1f2937; --accent: #00ff99; --accent2: #00c3ff;
            --warn: #f59e0b; --danger: #ef4444; --success: #10b981;
            --dim: #374151; --muted: #6b7280; --text: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Courier New', monospace;
            background: var(--bg); color: var(--text);
            min-height: 100vh; padding: 24px 16px 48px;
        }
        body::before {
            content: ''; position: fixed; inset: 0;
            background: repeating-linear-gradient(transparent 0px, transparent 3px,
                rgba(0,255,153,.015) 3px, rgba(0,255,153,.015) 4px);
            pointer-events: none; z-index: 999;
        }
        .container { max-width: 820px; margin: 0 auto; position: relative; z-index: 1; }
        .header { text-align: center; margin-bottom: 28px; }
        .header h1 { font-size: 1.6rem; letter-spacing: .2em; color: var(--accent);
            text-shadow: 0 0 18px var(--accent); text-transform: uppercase; }
        .header .sub { font-size: .72rem; color: var(--muted); letter-spacing: .12em; margin-top: 6px; }
        .badge { display: inline-block; background: linear-gradient(90deg,#1a2a1a,#0d2010);
            border: 1px solid var(--accent); color: var(--accent); font-size: .62rem;
            letter-spacing: .15em; padding: 3px 10px; border-radius: 2px; margin-top: 10px; }
        .card, .calc-card, .chance-card {
            background: var(--panel); border: 1px solid var(--border);
            border-radius: 6px; padding: 20px; margin-bottom: 16px;
        }
        .calc-card, .chance-card {
            background: linear-gradient(135deg, #0a0f1a 0%, #0d1520 100%);
            border-color: #1a3a5c;
        }
        .card-title, .calc-title, .chance-title {
            font-size: .65rem; letter-spacing: .18em; text-transform: uppercase;
            border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 16px;
        }
        .field { display: grid; grid-template-columns: 210px 1fr; align-items: center; gap: 10px; margin-bottom: 12px; }
        .field label { font-size: .72rem; color: var(--muted); letter-spacing: .06em; }
        .field input, select {
            background: var(--surface); color: var(--accent); border: 1px solid var(--dim);
            border-radius: 3px; padding: 7px 10px; font-family: inherit; font-size: .78rem; outline: none; width: 100%;
        }
        .btn-row { display: flex; gap: 10px; margin-top: 4px; }
        .btn {
            flex: 1; padding: 11px 16px; font-family: inherit; font-size: .8rem; font-weight: bold;
            letter-spacing: .1em; cursor: pointer; border: none; border-radius: 4px; transition: opacity .15s, transform .1s;
        }
        .btn-start { background: var(--success); color: #000; }
        .btn-stop { background: var(--danger); color: #fff; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-cell { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 10px 14px; }
        .stat-cell .label { font-size: .6rem; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
        .stat-cell .value { font-size: 1.05rem; font-weight: bold; color: var(--accent); }
        .progress-wrap { height: 4px; background: var(--border); border-radius: 2px; margin-top: 14px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width .4s; }
        .log { background: #000; color: var(--accent); height: 150px; overflow-y: scroll;
            padding: 10px 12px; font-size: .72rem; line-height: 1.6; border-radius: 4px; border: 1px solid var(--border); }
        .result-table { width: 100%; border-collapse: collapse; font-size: .72rem; }
        .result-table th { background: var(--surface); color: var(--accent2); letter-spacing: .1em; font-size: .62rem;
            text-transform: uppercase; padding: 10px 12px; border: 1px solid var(--border); text-align: left; }
        .result-table td { border: 1px solid var(--border); padding: 9px 12px; color: var(--text); word-break: break-all; }
        .footer { text-align: center; font-size: .6rem; color: var(--muted); letter-spacing: .1em; margin-top: 24px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📫 Random Slice Sniper</h1>
            <div class="sub">Hybrid Turbo v6 – WebGPU & WASM Dual Engine</div>
            <span class="badge" id="engineBadge">INITIALISEREN...</span>
        </div>
        <div class="card">
            <div class="card-title">⚙ Configuratie</div>
            <div class="field">
                <label>Target BTC Adres</label>
                <input id="btcAddr" value="1PWo3JeB9jrGwfHDNpdGK54CRas7fsVzXU" type="text">
            </div>
            <div class="field">
                <label>Engine</label>
                <select id="engineSelect">
                    <option value="wasm" selected>🏎 WASM (Stabiel & Snel)</option>
                    <option value="webgpu">⚡ WebGPU (Extreme snelheid op GPU)</option>
                </select>
            </div>
            <div class="field">
                <label>Keys per Plakje</label>
                <input id="keysLimit" value="10000000" type="number" min="1000">
            </div>
            <div class="btn-row">
                <button class="btn btn-start" id="startBtn">▶ Start Scan</button>
                <button class="btn btn-stop" id="stopBtn" disabled>■ Stop</button>
            </div>
        </div>
        <div class="card">
            <div class="card-title">📊 Statistieken</div>
            <div class="stats-grid">
                <div class="stat-cell"><div class="label">Status</div><div class="value" id="statusVal">Gestopt</div></div>
                <div class="stat-cell"><div class="label">Snelheid</div><div class="value" id="speed">0 /s</div></div>
                <div class="stat-cell"><div class="label">Totaal Gescand</div><div class="value" id="keysScanned">0</div></div>
                <div class="stat-cell"><div class="label">Plakjes</div><div class="value" id="slicesCount">0</div></div>
            </div>
            <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
        </div>
        <div class="card"><div class="card-title">📋 Log</div><div class="log" id="logBox"></div></div>
        <div class="card">
            <div class="card-title">🎯 Resultaten</div>
            <table class="result-table">
                <thead><tr><th>Type</th><th>WIF</th><th>Privésleutel</th></tr></thead>
                <tbody id="matchTable"><tr><td colspan="3">Nog geen match...</td></tr></tbody>
            </table>
        </div>
    </div>

    <script>
        // HIER KOMT DE LOGICA DIE DE BESTE ENGINE KIEST
        (function() {
            let workers = [], isRunning = false, totalScanned = 0, currentSliceScanned = 0;
            let startTime = 0, lastUpdate = Date.now(), lastScanned = 0;

            const log = (msg, cls='') => {
                const div = document.createElement('div');
                div.innerHTML = `<span style="color:var(--muted)">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
                if(cls) div.style.color = `var(--${cls})`;
                document.getElementById('logBox').appendChild(div);
                document.getElementById('logBox').scrollTop = document.getElementById('logBox').scrollHeight;
            };

            async function checkWebGPU() {
                if (!navigator.gpu) return false;
                try {
                    const adapter = await navigator.gpu.requestAdapter();
                    return !!adapter;
                } catch(e) { return false; }
            }

            async function init() {
                const hasGPU = await checkWebGPU();
                const badge = document.getElementById('engineBadge');
                if(hasGPU) {
                    badge.textContent = "WebGPU BESCHIKBAAR";
                    badge.style.color = "var(--accent)";
                } else {
                    badge.textContent = "WASM MODE (GEEN WEBGPU)";
                    document.getElementById('engineSelect').value = "wasm";
                    document.getElementById('engineSelect').options[1].disabled = true;
                }
                log("Systeem gereed. Kies een engine en start.");
            }

            function start() {
                if(isRunning) return;
                const engine = document.getElementById('engineSelect').value;
                const btc = document.getElementById('btcAddr').value;
                
                isRunning = true;
                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                document.getElementById('statusVal').textContent = "Zoeken...";
                document.getElementById('statusVal').style.color = "var(--success)";
                
                log(`Scan gestart met ${engine.toUpperCase()} engine...`, 'accent');
                
                if(engine === 'wasm') {
                    spawnWasmWorkers(btc);
                } else {
                    log("WebGPU engine wordt geïnitialiseerd...", 'warn');
                    // Hier zou de WebGPU kernel komen, maar we focussen nu op de stabiele Wasm fallback
                    // voor de laptop van de gebruiker.
                    spawnWasmWorkers(btc); 
                }
            }

            function spawnWasmWorkers(targetAddr) {
                const numW = navigator.hardwareConcurrency || 4;
                const startHex = "400000000000000000"; // Standaard Puzzel 71 start
                
                for(let i=0; i<numW; i++) {
                    const w = new Worker('worker.js');
                    w.onmessage = (e) => {
                        if(e.data.type === 'PROGRESS') {
                            totalScanned += e.data.count;
                            currentSliceScanned += e.data.count;
                            updateStats();
                        } else if(e.data.type === 'FOUND') {
                            stop();
                            document.getElementById('matchTable').innerHTML = `<tr><td>MATCH</td><td>${e.data.wif}</td><td>${e.data.privHex}</td></tr>`;
                            log("🎉 MATCH GEVONDEN!", 'success');
                        }
                    };
                    // Eenvoudige segmentatie voor demo
                    const segStart = (BigInt("0x"+startHex) + BigInt(i) * 1000000000n).toString(16);
                    w.postMessage({
                        type: 'ADDRESS_SCAN',
                        startHex: segStart,
                        endHex: "7fffffffffffffffff",
                        targetH160Hex: "a1c5d0f68d635a64375080000000000000000000", // Placeholder
                        targetAddress: targetAddr,
                        workerId: i
                    });
                    workers.push(w);
                }
            }

            function stop() {
                isRunning = false;
                workers.forEach(w => w.terminate());
                workers = [];
                document.getElementById('startBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
                document.getElementById('statusVal').textContent = "Gestopt";
                document.getElementById('statusVal').style.color = "var(--danger)";
                log("Scan gestopt.", 'stop');
            }

            function updateStats() {
                const now = Date.now();
                const diff = (now - lastUpdate) / 1000;
                if(diff >= 1) {
                    const speed = Math.floor((totalScanned - lastScanned) / diff);
                    document.getElementById('speed').textContent = speed.toLocaleString() + " /s";
                    document.getElementById('keysScanned').textContent = totalScanned.toLocaleString();
                    lastUpdate = now;
                    lastScanned = totalScanned;
                }
            }

            document.getElementById('startBtn').onclick = start;
            document.getElementById('stopBtn').onclick = stop;
            init();
        })();
    </script>
</body>
</html>
