<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Puzzel #71 – Random Slice Sniper (WASM TURBO v5) ⚡</title>
    <style>
        :root {
            --bg: #07090f; --surface: #0d1117; --panel: #111827;
            --border: #1f2937; --accent: #00ff99; --accent2: #00c3ff;
            --warn: #f59e0b; --danger: #ef4444; --success: #10b981;
            --dim: #374151; --muted: #6b7280; --text: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Courier New', monospace;
            background: var(--bg); color: var(--text);
            min-height: 100vh; padding: 24px 16px 48px;
        }
        body::before {
            content: ''; position: fixed; inset: 0;
            background: repeating-linear-gradient(transparent 0px, transparent 3px,
                rgba(0,255,153,.015) 3px, rgba(0,255,153,.015) 4px);
            pointer-events: none; z-index: 999;
        }
        .container { max-width: 820px; margin: 0 auto; position: relative; z-index: 1; }
        .header { text-align: center; margin-bottom: 28px; }
        .header h1 { font-size: 1.6rem; letter-spacing: .2em; color: var(--accent);
            text-shadow: 0 0 18px var(--accent); text-transform: uppercase; }
        .header .sub { font-size: .72rem; color: var(--muted); letter-spacing: .12em; margin-top: 6px; }
        .badge { display: inline-block; background: linear-gradient(90deg,#1a2a1a,#0d2010);
            border: 1px solid var(--accent); color: var(--accent); font-size: .62rem;
            letter-spacing: .15em; padding: 3px 10px; border-radius: 2px; margin-top: 10px; }
        .card, .calc-card, .chance-card {
            background: var(--panel); border: 1px solid var(--border);
            border-radius: 6px; padding: 20px; margin-bottom: 16px;
        }
        .card-title {
            font-size: .65rem; letter-spacing: .18em; text-transform: uppercase;
            border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 16px;
        }
        .field { display: grid; grid-template-columns: 210px 1fr; align-items: center; gap: 10px; margin-bottom: 12px; }
        .field label { font-size: .72rem; color: var(--muted); letter-spacing: .06em; }
        .field input, select {
            background: var(--surface); color: var(--accent); border: 1px solid var(--dim);
            border-radius: 3px; padding: 7px 10px; font-family: inherit; font-size: .78rem; outline: none; width: 100%;
        }
        .btn-row { display: flex; gap: 10px; margin-top: 4px; }
        .btn {
            flex: 1; padding: 11px 16px; font-family: inherit; font-size: .8rem; font-weight: bold;
            letter-spacing: .1em; cursor: pointer; border: none; border-radius: 4px; transition: opacity .15s, transform .1s;
        }
        .btn-start { background: var(--success); color: #000; }
        .btn-stop { background: var(--danger); color: #fff; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-cell { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 10px 14px; }
        .stat-cell .label { font-size: .6rem; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
        .stat-cell .value { font-size: 1.05rem; font-weight: bold; color: var(--accent); }
        #statusVal.running { color: var(--success); }
        .log { background: #000; color: var(--accent); height: 150px; overflow-y: scroll;
            padding: 10px 12px; font-size: .72rem; line-height: 1.6; border-radius: 4px; border: 1px solid var(--border); }
        .result-table { width: 100%; border-collapse: collapse; font-size: .72rem; }
        .result-table th { background: var(--surface); color: var(--accent2); padding: 10px 12px; border: 1px solid var(--border); text-align: left; }
        .result-table td { border: 1px solid var(--border); padding: 9px 12px; color: var(--text); word-break: break-all; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📫 Random Slice Sniper</h1>
            <div class="sub">Puzzel #71 – WASM Turbo v5 (Rust Engine)</div>
            <span class="badge">🚀 ULTRA-TURBO: WASM BATCH SCAN</span>
        </div>
        <div class="card">
            <div class="card-title">⚙ Configuratie</div>
            <div class="field">
                <label>Target BTC Adres</label>
                <input id="btcAddr" value="1PWo3JeB9jrGwfHDNpdGK54CRas7fsVzXU" type="text">
            </div>
            <div class="field">
                <label>Keys per Plakje</label>
                <input id="keysLimit" value="10000000" type="number">
            </div>
            <div class="field"><label>Workers (CPU Cores)</label><input id="numW" value="4" type="number"></div>
            <div class="field"><label>Start (HEX)</label><input id="rangeStart" value="40000000000000000" type="text"></div>
            <div class="field"><label>Eind (HEX)</label><input id="rangeEnd" value="7ffffffffffffffff" type="text"></div>
            <div class="btn-row">
                <button class="btn btn-start" id="startBtn">▶ Start Scan</button>
                <button class="btn btn-stop" id="stopBtn" disabled>■ Stop</button>
            </div>
        </div>
        
        <div class="card">
            <div class="card-title">📊 Statistieken</div>
            <div class="stats-grid">
                <div class="stat-cell"><div class="label">Status</div><div class="value" id="statusVal">Gestopt</div></div>
                <div class="stat-cell"><div class="label">Totaal Gescand</div><div class="value" id="keysScanned">0</div></div>
                <div class="stat-cell"><div class="label">Snelheid</div><div class="value" id="speed">0 /s</div></div>
                <div class="stat-cell"><div class="label">Plakjes</div><div class="value" id="slicesVisitedCount">0</div></div>
            </div>
        </div>
        <div class="card"><div class="card-title">📋 Log</div><div class="log" id="logBox"></div></div>
        <div class="card">
            <div class="card-title">🎯 Resultaten</div>
            <table class="result-table">
                <thead><tr><th>Type</th><th>WIF</th><th>Privésleutel (HEX)</th></tr></thead>
                <tbody id="matchTable"><tr><td colspan="3">Nog geen match...</td></tr></tbody>
            </table>
        </div>
    </div>

    <script>
        // --- BASE58CHECK DECODER ---
        const ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
        function decodeBase58(string) {
            let bytes = [0];
            for (let i = 0; i < string.length; i++) {
                let value = ALPHABET.indexOf(string[i]);
                if (value === -1) return null;
                for (let j = 0; j < bytes.length; j++) bytes[j] = bytes[j] * 58 + value;
                let carry = 0;
                for (let j = 0; j < bytes.length; j++) {
                    bytes[j] += carry;
                    carry = bytes[j] >> 8;
                    bytes[j] &= 0xff;
                }
                while (carry) {
                    bytes.push(carry & 0xff);
                    carry >>= 8;
                }
            }
            for (let i = 0; string[i] === '1' && i < string.length - 1; i++) bytes.push(0);
            return new Uint8Array(bytes.reverse());
        }

        function addressToH160(address) {
            try {
                const decoded = decodeBase58(address);
                if (!decoded) return null;
                // Bitcoin P2PKH: [version, 20 bytes H160, 4 bytes checksum]
                const h160 = decoded.slice(1, 21);
                return Array.from(h160).map(b => b.toString(16).padStart(2, '0')).join('');
            } catch (e) { return null; }
        }

        const log = (msg) => {
            const div = document.createElement('div');
            div.innerHTML = `<span>[${new Date().toLocaleTimeString()}]</span> ${msg}`;
            document.getElementById('logBox').prepend(div);
        };

        let workers = [];
        let isScanning = false;
        let totalKeys = 0;
        let startTime = 0;
        let lastUpdate = 0;
        let keysSinceLast = 0;

        const startScan = async () => {
            const targetH160 = addressToH160(document.getElementById('btcAddr').value);
            if (!targetH160) { alert("Ongeldig BTC Adres!"); return; }

            isScanning = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('statusVal').textContent = '⚡ Scannen...';
            document.getElementById('statusVal').classList.add('running');
            
            totalKeys = 0;
            startTime = performance.now();
            lastUpdate = performance.now();
            keysSinceLast = 0;

            const numW = parseInt(document.getElementById('numW').value);
            const limit = BigInt(document.getElementById('keysLimit').value);
            const startRange = BigInt("0x" + document.getElementById('rangeStart').value);

            for (let i = 0; i < numW; i++) {
                const w = new Worker('worker.js');
                w.onmessage = (e) => {
                    if (e.data.type === "PROGRESS") {
                        totalKeys += e.data.count;
                        keysSinceLast += e.data.count;
                        document.getElementById('keysScanned').textContent = totalKeys.toLocaleString();
                    } else if (e.data.type === "FOUND") {
                        log(`GEVONDEN! HEX: ${e.data.privHex}`);
                        const row = document.getElementById('matchTable').insertRow(0);
                        row.innerHTML = `<td>MATCH</td><td>${e.data.wif}</td><td>${e.data.privHex}</td>`;
                        stopScan();
                    }
                };
                const workerStart = startRange + (BigInt(i) * (limit / BigInt(numW)));
                w.postMessage({
                    type: "ADDRESS_SCAN",
                    startHex: workerStart.toString(16),
                    targetH160Hex: targetH160,
                    workerId: i
                });
                workers.push(w);
            }
            log(`Scan gestart op ${numW} workers. Target H160: ${targetH160}`);
            document.getElementById('slicesVisitedCount').textContent = "1";
        };

        const stopScan = () => {
            isScanning = false;
            workers.forEach(w => w.terminate());
            workers = [];
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('statusVal').textContent = 'Gestopt';
            document.getElementById('statusVal').classList.remove('running');
        };

        document.getElementById('startBtn').onclick = startScan;
        document.getElementById('stopBtn').onclick = stopScan;

        setInterval(() => {
            if (isScanning) {
                const now = performance.now();
                const diff = (now - lastUpdate) / 1000;
                const speed = Math.round(keysSinceLast / diff);
                document.getElementById('speed').textContent = speed.toLocaleString() + " /s";
                keysSinceLast = 0;
                lastUpdate = now;
            }
        }, 1000);
    </script>
</body>
</html>
